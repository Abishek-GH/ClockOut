<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef1f6" />
    <title>ClockOut – Know exactly when you can leave</title>
    <meta
      name="description"
      content="ClockOut shows how much office time is left and the exact time you can check out. Simple, free, works on your phone."
    />
    <meta name="application-name" content="ClockOut" />
    <meta name="apple-mobile-web-app-title" content="ClockOut" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClockOut" />
    <meta property="og:title" content="ClockOut – Your time. Your checkout." />
    <meta
      property="og:description"
      content="Know exactly when you can leave. See your remaining office time and checkout time instantly."
    />
    <meta property="og:image" content="og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClockOut – Your time. Your checkout." />
    <meta
      name="twitter:description"
      content="Know exactly when you can leave. See your remaining office time and checkout time instantly."
    />
    <meta name="twitter:image" content="og-image.png" />
    <script>
      // Apply saved/system theme before first paint (avoids a flash)
      try {
        var s = JSON.parse(localStorage.getItem('workday-calculator-v2')) || {};
        var t =
          s.theme ||
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <img class="logo" src="favicon.svg" alt="" width="46" height="46" />
          <div>
            <h1>ClockOut</h1>
            <p class="tagline">Your time. Your checkout.</p>
          </div>
        </div>
        <button
          type="button"
          class="icon"
          id="theme"
          aria-label="Switch between light and dark mode"
        >
          <svg
            class="moon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg
            class="sun"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </header>

      <div class="settings">
        <div class="seg" role="group" aria-label="Time format">
          <button type="button" id="f12" data-fmt="12">12H</button>
          <button type="button" id="f24" data-fmt="24">24H</button>
        </div>
        <label class="sw"
          ><input type="checkbox" id="secT" /><i></i><span>Seconds</span></label
        >
      </div>

      <div class="seg wide" role="tablist" aria-label="Calculation mode">
        <button type="button" role="tab" id="tabIn" data-mode="in">
          Check-in
        </button>
        <button type="button" role="tab" id="tabTill" data-mode="till">
          Last swipe
        </button>
      </div>

      <section class="card inputs" aria-label="Inputs">
        <div id="paneIn" class="pane">
          <div class="field">
            <span>I checked in at</span>
            <div class="tf" data-key="cin"></div>
            <label class="check"
              ><input
                type="checkbox"
                id="ydi"
                aria-label="Check-in was yesterday"
              />
              This was yesterday</label
            >
          </div>
        </div>

        <div id="paneTill" class="pane" hidden>
          <div class="field">
            <span>Completed so far</span>
            <div class="pair">
              <label class="unit"
                ><input
                  class="num"
                  id="ch"
                  inputmode="numeric"
                  maxlength="2"
                  placeholder="0"
                  autocomplete="off"
                /><i>hr</i></label
              >
              <label class="unit"
                ><input
                  class="num"
                  id="cm"
                  inputmode="numeric"
                  maxlength="2"
                  placeholder="0"
                  autocomplete="off"
                /><i>min</i></label
              >
              <label class="unit sec-only"
                ><input
                  class="num"
                  id="cs"
                  inputmode="numeric"
                  maxlength="2"
                  placeholder="0"
                  autocomplete="off"
                /><i>sec</i></label
              >
            </div>
          </div>
          <div class="field">
            <span>Recorded till</span>
            <div class="tf" data-key="till"></div>
            <label class="check"
              ><input
                type="checkbox"
                id="ydt"
                aria-label="Recorded time was yesterday"
              />
              This was yesterday</label
            >
          </div>
        </div>

        <div class="field">
          <span>Required hours</span>
          <div class="chips" id="chips">
            <button type="button" data-m="480">8h</button>
            <button type="button" data-m="510">8h 30m</button>
            <button type="button" data-m="540">9h</button>
          </div>
          <div class="pair">
            <label class="unit"
              ><input
                class="num"
                id="rh"
                inputmode="numeric"
                maxlength="2"
                autocomplete="off"
              /><i>hr</i></label
            >
            <label class="unit"
              ><input
                class="num"
                id="rm"
                inputmode="numeric"
                maxlength="2"
                autocomplete="off"
              /><i>min</i></label
            >
            <label class="unit sec-only"
              ><input
                class="num"
                id="rs"
                inputmode="numeric"
                maxlength="2"
                placeholder="0"
                autocomplete="off"
              /><i>sec</i></label
            >
          </div>
        </div>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </section>

      <section class="card result" id="result">
        <p class="label">Your expected checkout</p>
        <p class="hero" id="out">—</p>
        <p class="day" id="day"></p>
        <p class="sub" id="sub">
          Enter your details to see when you can leave.
        </p>
        <div
          class="bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          id="bar"
        >
          <div id="fill"></div>
        </div>
        <p class="pct" id="pct"></p>
        <dl class="stats">
          <div>
            <dt>Completed</dt>
            <dd id="sComp">—</dd>
          </div>
          <div>
            <dt>Required</dt>
            <dd id="sReq">—</dd>
          </div>
          <div>
            <dt id="sLeftL">Left</dt>
            <dd id="sLeft">—</dd>
          </div>
        </dl>
      </section>

      <button type="button" class="reset" id="reset">Reset</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
